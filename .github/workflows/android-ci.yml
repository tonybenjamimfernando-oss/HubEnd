name: HubEnd — CI Android e proveniência

# Valida as ferramentas HubOps, a interface HubEnd e o APK Android (shell Capacitor + motores HubOps).
# Variável opcional do repositório: APP_URL (endereço publicado da interface HubEnd).
# Sem APP_URL o APK abre o ecrã local android-shell/, com acesso à consola nativa HubOps.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hubend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Testes, lint e APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go (servidor GoPA)
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/gopa/go.mod

      - name: Ferramentas HubOps (GoPA, SNSE, NSC)
        run: |
          go -C tools/gopa test -race -count=1 ./...
          python3 -m py_compile tools/snse/*.py tools/nsc/*.py

      - name: Qualidade estática (sem SDK Android)
        run: |
          python3 tools/quality/check_kotlin_static.py android/hubops/src
          python3 tools/quality/validate_cve_db.py

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Interface HubEnd — dependências e testes
        run: |
          bun install --frozen-lockfile
          bunx vitest run

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O pacote legado "tools" (predefinição da action) já não existe no repositório da Google.
          packages: "platform-tools"

      - name: Pacotes Android fixados
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sincronizar shell Capacitor
        run: bunx cap sync android

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Testes unitários, lint e APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :hubops:testDebugUnitTest :app:testDebugUnitTest :hubops:lintDebug :app:lintDebug :app:assembleDebug

      - name: Resumo e digest
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/provenance
          sha256sum "$APK" | tee build/provenance/SHA256SUMS
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "app_url=${APP_URL:-<sem APP_URL: ecrã local>}"
            echo "artifact=app-debug.apk"
            echo "artifact_sha256=$(sha256sum "$APK" | cut -d' ' -f1)"
          } > build/provenance/build-metadata.txt
          {
            echo "### HubEnd APK debug"
            echo ""
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- Tamanho: $(du -h "$APK" | cut -f1)"
            echo "- Interface: ${APP_URL:-ecrã local (sem APP_URL)}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Atestação de proveniência
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK, relatórios e proveniência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubend-android-${{ github.sha }}
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/hubops/build/reports/tests/testDebugUnitTest/**
            android/app/build/reports/tests/testDebugUnitTest/**
            android/hubops/build/reports/lint-results-debug.*
            android/app/build/reports/lint-results-debug.*
            build/provenance/**

  device:
    # Testes em Android real (ART/ICU): apanham falhas que a JVM não mostra, como o fecho do 0.1.0.
    name: Testes em emulador Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Pacotes Android fixados
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sincronizar shell Capacitor
        run: |
          bun install --frozen-lockfile
          bunx cap sync android

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Arranque, consola nativa e testes HubOps em Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            ./gradlew --no-daemon :hubops:connectedDebugAndroidTest -PhubendDeviceTests

      - name: Relatórios dos testes em emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubend-device-tests-${{ github.sha }}
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests/**
            android/hubops/build/reports/androidTests/**

  release:
    # Download direto no telemóvel: o APK só é publicado depois de os testes JVM e em emulador passarem.
    name: Publicar APK para download
    if: github.event_name == 'push'
    needs: [android, device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obter APK testado
        uses: actions/download-artifact@v4
        with:
          name: hubend-android-${{ github.sha }}
          path: dist

      - name: Criar ou atualizar a versão no GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle | head -1)
          test -n "$VERSION"
          APK="HubEnd-${VERSION}-debug.apk"
          cp "$(find dist -name app-debug.apk | head -1)" "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES="APK de teste (debug) gerado e testado pelo CI no commit ${GITHUB_SHA}. Antes da primeira instalação desinstale a 0.1.0. SHA-256: ${SHA}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes "$NOTES" --prerelease
          else
            gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "HubEnd ${VERSION} (debug)" --notes "$NOTES" --prerelease
          fi
          gh release upload "v${VERSION}" "$APK" --clobber
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${APK}" >> "$GITHUB_STEP_SUMMARY"
